

name: KickyPlayTube Automation

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate video
        run: python main.py

      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: KickyPlayTube-Short
          path: output/*.mp4
          retention-days: 7
