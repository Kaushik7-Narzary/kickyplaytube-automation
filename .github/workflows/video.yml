
name: KickyPlayTube Automation

on:
  workflow_dispatch:

jobs:
  initialize:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize KickyPlayTube
        run: python main.py

      - name: Confirm completion
        run: echo "KickyPlayTube automation initialized!"
        
